apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ag-stack.adapterName" . }}
  labels:
    app.kubernetes.io/name: paz-extauthz-adapter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paz-extauthz-adapter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paz-extauthz-adapter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        # Extract PAZ's TLS cert so the adapter's fetch trusts the in-cluster
        # sideband endpoint (PAZ uses a self-signed cert). Re-extracted on
        # every adapter (re)start — self-heals across PAZ cert rotation.
        - name: extract-paz-cert
          image: alpine/openssl:3.3.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                echo | openssl s_client -connect {{ include "ag-stack.pazService" . }}:443 -servername {{ include "ag-stack.pazService" . }} 2>/dev/null | openssl x509 -outform pem > /certs/paz.crt && break
                sleep 5
              done
              test -s /certs/paz.crt
          volumeMounts:
            - name: paz-cert
              mountPath: /certs
      containers:
        - name: adapter
          image: {{ .Values.adapter.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_URL
              value: "https://{{ include "ag-stack.pazService" . }}:443"
            - name: SECRET_HEADER_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ include "ag-stack.sidebandSecret" . }}
                  key: SECRET_HEADER_VALUE
            - name: LISTEN_PORT
              value: "8082"
            - name: SIDEBAND_TIMEOUT_MS
              value: "5000"
            - name: DEBUG_LOGGING
              value: "false"
            - name: NODE_EXTRA_CA_CERTS
              value: /certs/paz.crt
          ports:
            - name: grpc
              containerPort: 8082
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            grpc:
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: paz-cert
              mountPath: /certs
              readOnly: true
      volumes:
        - name: paz-cert
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ag-stack.adapterName" . }}
  labels:
    app.kubernetes.io/name: paz-extauthz-adapter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8082
      targetPort: grpc
  selector:
    app.kubernetes.io/name: paz-extauthz-adapter
    app.kubernetes.io/instance: {{ .Release.Name }}
