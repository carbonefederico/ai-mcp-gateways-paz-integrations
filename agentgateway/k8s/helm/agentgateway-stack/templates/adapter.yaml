apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ag-stack.adapterName" . }}
  labels:
    app.kubernetes.io/name: paz-extauthz-adapter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paz-extauthz-adapter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paz-extauthz-adapter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        # Extract PAZ's TLS cert so the adapter's fetch trusts the in-cluster
        # sideband endpoint (PAZ uses a self-signed cert). Re-extracted on
        # every adapter (re)start — self-heals across PAZ cert rotation.
        - name: extract-paz-cert
          image: alpine/openssl:3.3.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              # PAZ regenerates its self-signed cert on every bootstrap (its
              # /opt/out is ephemeral). Extracting from the ClusterIP service
              # can capture a terminating pod's OLD cert — the handshake
              # succeeds against the old instance and every sideband call then
              # fails TLS trust. So: connect to the PAZ POD FQDN (the same
              # single-pod identity the adapter uses at runtime), and extract
              # only once that pod itself answers.
              PAZ_FQDN={{ include "ag-stack.pazService" . }}-0.{{ include "ag-stack.pazService" . }}-cluster.{{ .Release.Namespace }}.svc.cluster.local
              for i in $(seq 1 60); do
                echo | openssl s_client -connect "$PAZ_FQDN:1443" -servername "$PAZ_FQDN" 2>/dev/null | openssl x509 -outform pem > /certs/paz.crt && break
                sleep 5
              done
              test -s /certs/paz.crt
          volumeMounts:
            - name: paz-cert
              mountPath: /certs
      containers:
        - name: adapter
          image: {{ .Values.adapter.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_URL
              # PAZ's bootstrap self-signed cert lists the POD FQDN as SAN (not
              # the ClusterIP service name), so the adapter must connect to the
              # pod — via the headless StatefulSet DNS — for TLS name checking
              # to pass. PAZ listens on HTTPS_PORT 1443.
              value: "https://{{ include "ag-stack.pazService" . }}-0.{{ include "ag-stack.pazService" . }}-cluster.{{ .Release.Namespace }}.svc.cluster.local:1443"
            - name: SECRET_HEADER_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ include "ag-stack.sidebandSecret" . }}
                  key: SECRET_HEADER_VALUE
            - name: LISTEN_PORT
              value: "8082"
            - name: SIDEBAND_TIMEOUT_MS
              value: "2000"
            - name: DEBUG_LOGGING
              value: "false"
            - name: NODE_EXTRA_CA_CERTS
              value: /certs/paz.crt
          ports:
            - name: grpc
              containerPort: 8082
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # The adapter speaks the ext_authz gRPC service only — it does not
          # implement grpc.health.v1, which K8s gRPC probes require. Probe
          # the port at TCP level instead.
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: paz-cert
              mountPath: /certs
              readOnly: true
      volumes:
        - name: paz-cert
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ag-stack.adapterName" . }}
  labels:
    app.kubernetes.io/name: paz-extauthz-adapter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8082
      targetPort: grpc
  selector:
    app.kubernetes.io/name: paz-extauthz-adapter
    app.kubernetes.io/instance: {{ .Release.Name }}
