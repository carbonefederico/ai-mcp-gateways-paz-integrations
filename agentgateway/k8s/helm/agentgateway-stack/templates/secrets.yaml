apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ag-stack.sidebandSecret" . }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
{{- /* PAZ bakes the shared secret into its server config at bootstrap; it
      cannot learn a new value without a full re-bootstrap. So the secret must
      be stable across helm upgrades: create-once (random on first install),
      then reuse the stored value forever. A bare randAlphaNum in the template
      regenerates on every upgrade and silently desynchronizes PAZ (401s). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "ag-stack.sidebandSecret" .) }}
{{- $value := randAlphaNum 40 }}
{{- if and $existing $existing.data.SECRET_HEADER_VALUE }}
{{-   $value = $existing.data.SECRET_HEADER_VALUE | b64dec }}
{{- end }}
stringData:
  SECRET_HEADER_VALUE: {{ $value | quote }}
