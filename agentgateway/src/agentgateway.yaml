# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Routing form: one route per MCP (pathPrefix /mcp/<name>), each with its own
# backend target and the shared extAuthz policy. The per-MCP path is what PAZ
# keys on: the sideband envelope carries the original client URL, and the
# policy tree selects the MCP by the leaf path segment (leaf == portfolio /
# customer …) under the AgentGateway policy set. stateless mode (2026-07-28
# MCP draft) — every POST is self-contained; HITL binding is token⇄payload
# via the txn mirror, not session state.
gateways:
  default:
    port: 3001
    protocol: HTTP
routes:
- name: mcp-portfolio
  matches:
  - path:
      pathPrefix: /mcp/portfolio
  backends:
  - mcp:
      targets:
      - name: portfolio
        mcp:
          host: http://localhost:3000/mcp/portfolio
  policies:
    extAuthz:
      host: localhost:8083
      failureMode: deny
      protocol:
        grpc: {}
      includeRequestBody:
        maxRequestBytes: 65536
        allowPartialMessage: false
      policies:
        http:
          requestTimeout: 5s
# RFC 9728 protected-resource metadata — plain HTTP passthrough to demo-mcp.
# The backend handler derives the protected resource from the request path,
# which must end in /mcp/<endpoint>; rewrite the client-facing suffix
# (/portfolio) to that form before forwarding.
- name: mcp-metadata
  matches:
  - path:
      pathPrefix: /.well-known/oauth-protected-resource/portfolio
  backends:
  - host: localhost:3000
  policies:
    urlRewrite:
      path:
        full: /.well-known/oauth-protected-resource/mcp/portfolio
    requestHeaderModifier:
      set:
        x-client-host: localhost:3001
        x-client-proto: http
