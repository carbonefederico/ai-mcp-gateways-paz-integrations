# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Simplified MCP mode (top-level `mcp:` block): serves the aggregated MCP
# endpoint at /mcp and /sse on the gateway below, and is the form the
# management UI's MCP page (targets, playground, capability toggle) reads and
# writes. extAuthz attaches under mcp.policies — same PAZ chain as the
# routing-based form, which this block replaces.
# statefulMode: stateless (2026-07-28 MCP draft) — every POST is self-contained,
# no initialize/session handshake, matching the APIM integration's posture where
# PAZ permits and the request goes straight to the backend. HITL binding is
# token⇄payload via the txn mirror, not session state.
gateways:
  default:
    port: 3001
    protocol: HTTP
mcp:
  statefulMode: stateless
  targets:
  - name: portfolio
    mcp:
      host: http://localhost:3000/mcp/portfolio
  policies:
    extAuthz:
      host: localhost:8083
      failureMode: deny
      protocol:
        grpc: {}
      includeRequestBody:
        maxRequestBytes: 65536
        allowPartialMessage: false
      policies:
        http:
          requestTimeout: 5s
routes:
# RFC 9728 protected-resource metadata — plain HTTP passthrough to demo-mcp.
# The backend handler derives the protected resource from the request path,
# which must end in /mcp/<endpoint>; rewrite the client-facing suffix
# (/portfolio) to that form before forwarding.
- name: mcp-metadata
  matches:
  - path:
      pathPrefix: /.well-known/oauth-protected-resource/portfolio
  backends:
  - host: localhost:3000
  policies:
    urlRewrite:
      path:
        full: /.well-known/oauth-protected-resource/mcp/portfolio
    requestHeaderModifier:
      set:
        x-client-host: localhost:3001
        x-client-proto: http
